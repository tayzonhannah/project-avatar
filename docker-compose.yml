services:
  project-avatar-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avatar_ncr_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PYTHONHASHSEED=42
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      - ./data:/app/data:ro
      - ./docs:/app/docs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
